<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotizá tu Usado</title>
    <link rel ="stylesheet" href="../public/styles.css">
</head>
<body>
    <header class="navega-bar">
        <div class="nav-izq">
            <a href="inicio.html" class="logo-rt"><strong>RT</strong></a>
        </div>
        <nav class="nav-centro">
            <ul>
                <li><a href="catalogo.html">Catalogo</a></li>
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="cotizar.html">Cotizar</a></li>
            </ul>
        </nav>
        <div class="nav-der">
            <a href="login.html">Acceso Técnico</a>
        </div>
    </header>

    <main>
        <section>
            <h2>Mandanos los datos de tu celular</h2>
            <p>Completá el formulario y para que podamos darte un presupuesto estimado. (Límite: 1 consulta cada 24hs).</p>
            

            <form action="admin.html" method="POST">
                <div>
                    <label for="telefono_contacto">Tu WhatsApp:</label>
                    <input type="tel" name="telefono_contacto" id="telefono_contacto" required>
                </div>
                
                <div>
                    <label for="marca_equipo">Marca del equipo:</label>
                    <select name="marca" id="marca">
                        <option value="samsung">Samsung</option>
                        <option value="motorola">Motorola</option>
                        <option value="xiaomi">Xiaomi</option>
                        <option value="apple">Apple</option>
                        <option value="otra">Otra (especificar)</option>
                    </select>
                </div>

                <div>
                    <label for="modelo_equipo">Modelo exacto:</label>
                    <input type="text" name="modelo_equipo" id="modelo_equipo" required>
                </div>

                <div>
                    <label for="estado">Estado general:</label>
                    <select name="estado" id="estado">
                        <option value="impecable">Impecable (como nuevo)</option>
                        <option value="usado_bueno">Usado (marcas de uso normales)</option>
                        <option value="roto_enciende">Pantalla o vidrio roto (enciende)</option>
                        <option value="no_enciende">No enciende / Para repuestos</option>
                    </select>
                </div>

                <div>
                    <label for="detalles">Contanos qué le duele (cambios de pin, módulo alternativo, etc):</label><br>
                    <textarea name="detalles" id="detalles" rows="5" cols="40"></textarea>
                </div>

                <button type="submit">Enviar Cotización</button>
            </form>
        </section>
    </main>
</body>
</html>
